<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Quiz</title>

<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Caveat:wght@700&display=swap');
  :root{
    --accent-orange:#ff7a1a;
    --accent-pink:#ff2e7e;
    --accent-lime:#c6ff4d;
    --accent-red:#ff2e42;
    --panel-bg:#1c0d16;
    --text:#ffe9c7;
    --muted:#c98a6b;
    --font-pixel:'Press Start 2P', monospace;
    --font-body:'VT323', monospace;
    --font-script:'Caveat', cursive;
  }
  *{box-sizing:border-box;}
  body{margin:0;}

  .scene-bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:linear-gradient(to bottom, #1c0616 0%, #4a0f22 32%, #8a1a2c 58%, #c9502e 78%, #7a1220 100%);
  }
  .scene-sun{
    position:absolute; left:50%; top:8%; width:300px; height:300px; transform:translateX(-50%);
    border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 42%,
      #ffe9a8 0 6%, #ffcf6b 6% 14%, #ffb04d 14% 24%, #ff8f4d 24% 36%,
      #ff6a3d 36% 50%, #ff4d3d 50% 66%, #d63a2e 66% 100%);
    box-shadow:0 0 100px 30px rgba(255,122,26,0.35);
    animation: sunShimmer 6s ease-in-out infinite;
  }
  @keyframes sunShimmer{
    0%,100%{ filter:hue-rotate(0deg) brightness(1); box-shadow:0 0 100px 30px rgba(255,122,26,0.35); }
    50%{ filter:hue-rotate(22deg) brightness(1.12); box-shadow:0 0 130px 45px rgba(255,180,90,0.45); }
  }
  @media (prefers-reduced-motion: reduce){ .scene-sun{ animation:none; } }
  .scene-city{position:absolute; left:0; bottom:36%; width:100%; height:34%; overflow:hidden;}
  .scene-reflection{ bottom:auto; top:70%; transform:scaleY(-1); opacity:.6;
    -webkit-mask-image:linear-gradient(to bottom, black, black 30%, transparent 92%);
    mask-image:linear-gradient(to bottom, black, black 30%, transparent 92%);
  }
  .scene-water-glow{
    position:absolute; left:50%; top:68%; width:280px; height:230px; transform:translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(255,214,140,0.6), rgba(255,150,90,0.35) 35%, rgba(255,90,60,0.15) 60%, transparent 78%);
    filter: blur(3px);
    mix-blend-mode: screen;
    animation: waterGlow 4s ease-in-out infinite;
  }
  @keyframes waterGlow{ 0%,100%{ opacity:.75; transform:translateX(-50%) scaleY(1); } 50%{ opacity:1; transform:translateX(-50%) scaleY(1.06); } }
  .scene-water-ripple{
    position:absolute; left:0; right:0; top:70%; bottom:0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 9px);
    mix-blend-mode: overlay;
    animation: rippleShift 3s linear infinite;
    pointer-events:none;
  }
  @keyframes rippleShift{ 0%{ background-position:0 0; } 100%{ background-position:0 18px; } }
  @media (prefers-reduced-motion: reduce){ .scene-water-glow, .scene-water-ripple{ animation:none; } }
  .scene-city-track{ display:block; width:200%; height:100%; animation: scrollCity 50s linear infinite; }
  @keyframes scrollCity{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .scene-city-track{ animation:none; } }
  .scene-scanlines{
    position:absolute; inset:0; pointer-events:none; opacity:.45;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
  }
  .scene-vignette{
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.55), transparent 60%),
               linear-gradient(to bottom, transparent 55%, rgba(10,4,8,0.65) 100%);
  }

  .quiz-root{
    min-height:100vh; position:relative; z-index:1;
    color:var(--text); font-family:var(--font-body); font-size:20px;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 60px;
  }

  .eyebrow{
    font-family:var(--font-pixel); letter-spacing:.15em; text-transform:uppercase;
    font-size:10px; color:var(--accent-pink); margin-bottom:10px;
  }
  h1.quiz-title{
    font-family:var(--font-pixel); font-size:clamp(16px,4vw,24px); line-height:1.5;
    color:var(--accent-orange); text-shadow:3px 3px 0 rgba(0,0,0,0.6);
    margin:0 0 12px; text-align:center;
  }
  .quiz-sub{color:var(--muted); text-align:center; margin-bottom:26px; max-width:520px; font-size:19px;}

  .title-wrap{display:flex; align-items:center; gap:24px; flex-wrap:wrap; justify-content:center; margin-bottom:14px;}
  .portrait-frame{
    width:110px; height:110px; flex-shrink:0;
    border:4px solid var(--accent-pink); box-shadow:6px 6px 0 #000; overflow:hidden;
    clip-path: polygon(0 10px,10px 10px,10px 0,calc(100% - 10px) 0,calc(100% - 10px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 10px) calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,10px calc(100% - 10px),0 calc(100% - 10px));
  }
  .portrait-frame img{width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block;}
  .title-text{text-align:left;}
  h1.pixel-title{
    font-family:var(--font-pixel); font-size:clamp(24px,6vw,38px); line-height:1.35;
    color:var(--accent-orange); text-shadow:3px 3px 0 var(--accent-pink), 6px 6px 0 rgba(0,0,0,0.55);
    margin:0;
  }
  .script-sub{
    font-family:var(--font-script); font-size:clamp(22px,4.5vw,30px); color:var(--accent-lime);
    margin:2px 0 0 4px; display:inline-block; transform:rotate(-3deg);
  }
  .rotate-tip{
    font-family:var(--font-body); font-size:18px;
    background:rgba(0,0,0,0.4); border:2px dashed var(--accent-orange);
    color:var(--text); padding:8px 16px; margin:16px 0 22px; text-align:center;
  }

  .quiz-card{
    background:var(--panel-bg); border:4px solid var(--accent-pink);
    box-shadow:8px 8px 0 rgba(0,0,0,0.65); padding:26px;
    width:100%; max-width:640px;
    clip-path: polygon(0 14px,14px 14px,14px 0,calc(100% - 14px) 0,calc(100% - 14px) 14px,100% 14px,100% calc(100% - 14px),calc(100% - 14px) calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,14px calc(100% - 14px),0 calc(100% - 14px));
  }

  .btn{
    appearance:none; font-family:var(--font-pixel); font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; line-height:1.7; border:3px solid #000; border-radius:0;
    padding:14px 18px; cursor:pointer; color:#160810;
    box-shadow:4px 4px 0 #000; transition:transform .05s, box-shadow .05s;
  }
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 #000;}
  .btn-primary{background:var(--accent-lime);}
  .btn-primary:hover{background:#d8ff7a;}
  .btn-ghost{background:var(--accent-orange); color:#160810;}
  .btn-ghost:hover{background:#ff9247;}
  .btn-block{width:100%;}
  .btn-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}

  .role-choice{display:flex; gap:16px; flex-direction:column; width:100%; max-width:440px;}
  .role-btn{
    padding:20px; text-align:left; cursor:pointer;
    background:var(--panel-bg); border:3px solid var(--accent-pink);
    box-shadow:5px 5px 0 rgba(0,0,0,0.6); color:var(--text); font-family:var(--font-body);
  }
  .role-btn:hover{border-color:var(--accent-lime);}
  .role-btn h3{margin:0 0 8px; font-family:var(--font-pixel); font-size:13px; color:var(--accent-orange);}
  .role-btn p{margin:0; color:var(--muted); font-size:16px;}

  input.quiz-input{
    width:100%; padding:12px 14px; border:3px solid var(--accent-orange);
    background:#0d0509; color:var(--text); font-size:20px; font-family:var(--font-body); border-radius:0;
  }
  input.quiz-input:focus{outline:2px solid var(--accent-lime);}

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--font-pixel); font-size:10px; letter-spacing:.05em;
    background:rgba(255,122,26,0.15); color:var(--accent-orange);
    border:2px solid var(--accent-orange); padding:6px 10px; border-radius:0;
  }
  .q-text{font-family:var(--font-body); font-size:clamp(22px,4.5vw,32px); font-weight:400; line-height:1.3; margin:16px 0 22px;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:480px){.options{grid-template-columns:1fr;}}
  .opt{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:14px; text-align:left;
    background:rgba(255,255,255,0.04); border:3px solid rgba(255,255,255,0.25);
    color:var(--text); font-family:var(--font-body); font-size:19px; cursor:pointer; border-radius:0;
  }
  .opt-main{display:flex; align-items:center; gap:10px;}
  .opt-img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; margin-top:8px; border:2px solid rgba(255,255,255,0.15);}
  .q-images{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .q-images .img-cell{position:relative;}
  .q-images img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; border:3px solid var(--accent-pink);}
  .q-images .img-badge{
    position:absolute; top:6px; left:6px; background:#000; color:var(--accent-orange);
    font-family:var(--font-pixel); font-size:10px; padding:4px 7px; border:2px solid var(--accent-orange);
  }
  .opt:hover{background:rgba(255,122,26,0.1); border-color:var(--accent-orange);}
  .opt .letter{
    width:26px; height:26px; flex-shrink:0; background:transparent; border:2px solid currentColor; border-radius:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-pixel); font-weight:400; font-size:11px;
  }
  .opt.selected{border-color:var(--accent-orange); background:rgba(255,122,26,0.15);}
  .opt.correct{border-color:var(--accent-lime); background:rgba(198,255,77,0.15); color:var(--accent-lime);}
  .opt.wrong{border-color:var(--accent-red); background:rgba(255,46,66,0.15); color:#ff8b96;}
  .opt[disabled]{cursor:default;}

  .avatar{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:var(--font-pixel); color:#160810; border:2px solid #000;
  }
  .avatar-row{display:flex; gap:4px; flex-wrap:wrap; margin-top:2px;}

  .name-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:10px; width:100%; max-width:600px;}
  .name-btn{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 8px; background:var(--panel-bg); border:3px solid var(--accent-pink);
    cursor:pointer; color:var(--text); font-family:var(--font-body); font-size:16px;
  }
  .name-btn:hover{border-color:var(--accent-lime);}
  .name-btn.taken{opacity:.3; pointer-events:none;}

  .player-list{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0;}
  .player-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,46,126,0.1); border:2px solid var(--accent-pink);
    padding:5px 12px 5px 5px; border-radius:0; font-size:16px; font-family:var(--font-body);
  }
  .qr-block{text-align:center; margin-top:20px; padding-top:18px; border-top:2px dashed rgba(255,255,255,0.15);}
  .qr-frame{background:#ffe9c7; padding:10px; display:inline-block; border:3px solid var(--accent-orange);}

  .board-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; margin-bottom:8px; border-radius:0;
    background:rgba(0,0,0,0.25); border:2px solid rgba(255,255,255,0.15);
  }
  .board-row.first{background:rgba(198,255,77,0.12); border-color:var(--accent-lime);}
  .board-name{display:flex; align-items:center; gap:10px; font-family:var(--font-body); font-size:19px;}
  .board-score{font-family:var(--font-pixel); font-weight:400; font-size:14px; color:var(--accent-orange);}
  .muted{color:var(--muted); font-size:16px;}
  .small-link{
    background:none; border:none; color:var(--muted); text-decoration:underline;
    cursor:pointer; font-family:var(--font-body); font-size:16px;
  }
  .footer-bar{margin-top:18px; display:flex; justify-content:space-between; align-items:center;}

  .winners-row{display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:10px 0 26px;}
  @keyframes floatBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  @keyframes glowPulse{ 0%,100%{box-shadow:0 0 0px 0px var(--accent-lime), 0 0 0 3px #000;} 50%{box-shadow:0 0 22px 8px var(--accent-lime), 0 0 0 3px #000;} }
  .winner-avatar-big{
    width:84px; height:84px; font-size:22px; border-width:3px;
    animation: floatBounce 1.3s ease-in-out infinite, glowPulse 1.3s ease-in-out infinite;
  }
</style>

  function initials(name){
    return name.split(' ').map(p=>p[0]).filter(Boolean).join('').toUpperCase().slice(0,2);
  }
  function avatarColorFor(name){
    const idx = PLAYER_NAMES.indexOf(name);
    if(idx>=0) return AVATAR_COLORS[idx % AVATAR_COLORS.length];
    let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i))>>>0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function avatarHTML(name, size, extraClass){

    const cls = "avatar" + (extraClass ? " "+extraClass : "");
    const img = AVATAR_IMAGES[name];

  function sbHeaders(extra){

      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, extra||{});
  }
  async function sbGet(key, fallback){
    try{
      const r = await fetch(SUPABASE_URL + '/rest/v1/quiz_kv?key=eq.' + key + '&select=value', {headers: sbHeaders()});
      const rows = await r.json();
      if(Array.isArray(rows) && rows.length && rows[0].value !== undefined && rows[0].value !== null) return rows[0].value;
      return fallback;
    }catch(e){ return fallback; }
  }
  async function sbSet(key, value){

  function scoreOf(player){
    let total = 0;
    Object.keys(player.answers||{}).forEach(qi=>{
      const q = QUESTIONS[qi];
      if(q && player.answers[qi] === q.correct) total += q.points;
    });
    return total;
  }
  function rankPlayers(players){
    return Object.keys(players).map(name=>({name, score: scoreOf(players[name])})).sort((a,b)=> b.score - a.score);

  // ---------- PLAYER: JOIN ----------
  async function renderJoin(){
    const players = await getPlayers();
    const taken = new Set(Object.keys(players));
    root.innerHTML = `
      <div class="eyebrow">Подключение</div>
      <h1 class="quiz-title">Кто ты?</h1>
      <div class="name-grid">
        ${PLAYER_NAMES.map(n=>`
          <button class="name-btn ${taken.has(n)?'taken':''}" data-name="${n}" style="${PLAYER_BG_COLORS[n] ? `background:${PLAYER_BG_COLORS[n]};` : ''}">
            ${avatarHTML(n,52)}
            <span>${n}</span>
          </button>
        `).join('')}
      </div>
      <div style="margin-top:18px; text-align:center;">
        <button class="small-link" id="otherNameLink">Меня нет в списке</button>
      </div>
      <div class="quiz-card" id="otherNameCard" style="display:none; max-width:420px; margin-top:14px;">
        <input class="quiz-input" id="nameInput" placeholder="Твоё имя" maxlength="20" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="joinBtn">Присоединиться</button></div>
      </div>
      <div style="margin-top:14px;"><button class="small-link" id="backBtn">← назад</button></div>
    `;
    document.getElementById('backBtn').onclick = renderRoleSelect;
    async function join(name){
      if(!name) return;
      myName = name;
      const fresh = await getPlayers();
      if(!fresh[myName]) fresh[myName] = {answers:{}};
      await setPlayers(fresh);
      renderPlayerLoop();
    }
    root.querySelectorAll('.name-btn').forEach(btn=>{
      btn.onclick = ()=> join(btn.dataset.name);
    });
    document.getElementById('otherNameLink').onclick = ()=>{
      document.getElementById('otherNameCard').style.display = 'block';
    };
    document.getElementById('joinBtn').onclick = ()=>{
      join(document.getElementById('nameInput').value.trim());
    };
  }

  // ---------- PLAYER: MAIN LOOP ----------
  function renderPlayerLoop(){
    startPolling(async ()=>{
      const state = await getState();
      const players = await getPlayers();
      const me = players[myName] || {answers:{}};

      if(state.phase === 'lobby'){
        root.innerHTML = `
          <div class="eyebrow">Привет, ${myName} 👋</div>
          <h1 class="quiz-title">Ждём начала игры…</h1>
          <p class="quiz-sub">Ведущая скоро начнёт. Держи телефон под рукой (лучше горизонтально).</p>
          <div class="quiz-card" style="max-width:420px; text-align:center;">
            <div class="muted">Игроков в лобби: ${Object.keys(players).length}</div>
          </div>
        `;
        return;
      }

      if(state.phase === 'question'){
        const q = QUESTIONS[state.qIndex];
        const already = me.answers && (state.qIndex in me.answers);
        if(!already){
          root.innerHTML = `
            <div class="eyebrow">Вопрос ${state.qIndex+1} из ${QUESTIONS.length}</div>
            <div class="quiz-card">
              <span class="chip">×${q.points} балл${q.points>1?(q.points<5?'а':'ов'):''}</span>
              <div class="q-text">${q.text}</div>
            ${questionImagesHTML(q)}
              <div class="options">
                ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${optionInner(q,i)}</button>`).join('')}
              </div>
            </div>
          `;
          root.querySelectorAll('.opt').forEach(btn=>{
            btn.onclick = async ()=>{
              const i = parseInt(btn.dataset.i,10);
              const freshPlayers = await getPlayers();
              if(!freshPlayers[myName]) freshPlayers[myName] = {answers:{}};
              freshPlayers[myName].answers[state.qIndex] = i;
              await setPlayers(freshPlayers);
            };
          });
        } else {
          const myChoice = me.answers[state.qIndex];
          root.innerHTML = `
            <div class="eyebrow">Вопрос ${state.qIndex+1} из ${QUESTIONS.length}</div>
            <div class="quiz-card" style="text-align:center;">
              <div class="q-text" style="margin-bottom:6px;">Ответ принят ✅</div>
              <p class="muted">Ты выбрал: ${LETTERS[myChoice]}. ${q.options[myChoice]}</p>
              <p class="muted">Ждём остальных и ведущую…</p>
            </div>
          `;
        }
        return;
      }

      if(state.phase === 'reveal'){
        const q = QUESTIONS[state.qIndex];
        const myChoice = (me.answers||{})[state.qIndex];
        const gotIt = myChoice === q.correct;
        root.innerHTML = `
          <div class="eyebrow">Вопрос ${state.qIndex+1} из ${QUESTIONS.length}</div>
          <div class="quiz-card">
            <div class="q-text">${q.text}</div>
            ${questionImagesHTML(q)}
            <div class="options">
              ${q.options.map((o,i)=>{
                let cls='opt';
                if(i===q.correct) cls+=' correct';
                else if(i===myChoice) cls+=' wrong';
                const who = playersWhoChose(players, state.qIndex, i);
                return `<div class="${cls}">${optionInner(q,i)}${avatarRowHTML(who,16)}</div>`;
              }).join('')}
            </div>
            <p style="margin-top:16px; font-weight:700;">
              ${myChoice===undefined ? 'Ты не успел(а) ответить' : gotIt ? `Верно! +${q.points} балл(ов) 🎉` : 'Мимо в этот раз 🙈'}
            </p>
            <p class="muted">Твой счёт: ${scoreOf(me)}</p>
          </div>
        `;
        return;
      }

      if(state.phase === 'blockSummary'){
        renderBlockSummary(players, state.qIndex, false);
        return;
      }

      if(state.phase === 'end'){
        renderFinal(players, true);
        return;
      }
    });
  }

          if(qrDiv && window.QRCode){
            qrDiv.innerHTML='';
            new QRCode(qrDiv, {text: window.location.href, width:150, height:150, colorDark:'#160810', colorLight:'#ffe9c7', correctLevel: QRCode.CorrectLevel.M});
          }
        }catch(e){}
        return;
      }

      if(state.phase === 'question' || state.phase === 'reveal'){
        const q = QUESTIONS[state.qIndex];
        const answeredCount = Object.values(players).filter(p=> state.qIndex in (p.answers||{})).length;
        root.innerHTML = `
          <div class="eyebrow">Вопрос ${state.qIndex+1} из ${QUESTIONS.length}</div>
          <div class="quiz-card">
            <span class="chip">×${q.points} балл${q.points>1?(q.points<5?'а':'ов'):''}</span>
            <div class="q-text">${q.text}</div>
            ${questionImagesHTML(q)}
            <div class="options">
              ${q.options.map((o,i)=>{
                let cls='opt';
                if(state.phase==='reveal' && i===q.correct) cls+=' correct';
                const who = state.phase==='reveal' ? playersWhoChose(players, state.qIndex, i) : [];
                return `<div class="${cls}">${optionInner(q,i)}${avatarRowHTML(who,18)}</div>`;
              }).join('')}
            </div>
            <p class="muted" style="margin-top:14px;">Ответили: ${answeredCount} из ${Object.keys(players).length}</p>
            <div class="btn-row">
              ${state.phase==='question'
                ? `<button class="btn btn-primary" id="revealBtn">Показать правильный ответ</button>`
                : (BLOCK_ENDS.has(state.qIndex)
                    ? `<button class="btn btn-primary" id="blockBtn">Итоги блока</button>`
                    : `<button class="btn btn-primary" id="nextBtn">Следующий вопрос</button>`)
              }
              <button class="btn btn-ghost" id="resetBtn2">Сбросить всё</button>
            </div>
          </div>
        `;
        if(state.phase==='question'){
          document.getElementById('revealBtn').onclick = async ()=>{ await setState({phase:'reveal', qIndex:state.qIndex}); };
        } else if(BLOCK_ENDS.has(state.qIndex)){
          document.getElementById('blockBtn').onclick = async ()=>{ await setState({phase:'blockSummary', qIndex:state.qIndex}); };
        } else {
          document.getElementById('nextBtn').onclick = async ()=>{ await setState({phase:'question', qIndex:state.qIndex+1}); };
        }
        document.getElementById('resetBtn2').onclick = async ()=>{ await setState({phase:'lobby', qIndex:0}); await setPlayers({}); };
        return;
      }

      if(state.phase === 'blockSummary'){
        renderBlockSummary(players, state.qIndex, true);
        return;
      }

      if(state.phase === 'end'){
        renderFinal(players, false);
      }
    });
  }

  // ---------- BLOCK SUMMARY (shared) ----------
  function renderBlockSummary(players, qIndex, isHost){
    const blockNum = blockNumberFor(qIndex);
    const ranked = rankPlayers(players);
    root.innerHTML = `
      <div class="eyebrow">Итоги блока ${blockNum}</div>
      <h1 class="quiz-title">Промежуточный счёт</h1>
      <div class="quiz-card">
        ${ranked.map((r,i)=>`
          <div class="board-row ${i===0 && r.score>0 ? 'first':''}">
            <span class="board-name">${avatarHTML(r.name,22)} ${i+1}. ${r.name}</span>
            <span class="board-score">${r.score}</span>
          </div>
        `).join('') || '<p class="muted">Пока никто не набрал очков.</p>'}
        ${isHost
          ? `<div class="btn-row"><button class="btn btn-primary" id="blockNextBtn">${qIndex===QUESTIONS.length-1 ? 'Финальные итоги 🏆' : 'Следующий блок →'}</button></div>`
          : `<p class="muted" style="margin-top:14px;">Ждём ведущую…</p>`
        }
      </div>
    `;
    if(isHost){
      document.getElementById('blockNextBtn').onclick = async ()=>{
        if(qIndex===QUESTIONS.length-1){ await setState({phase:'end', qIndex}); }
        else { await setState({phase:'question', qIndex:qIndex+1}); }
      };
    }
  }

  // ---------- FINAL ----------
  function renderFinal(players, isPlayerView){
    const ranked = rankPlayers(players);
    const topScore = ranked.length ? ranked[0].score : 0;
    const winners = ranked.filter(r=>r.score===topScore && topScore>0);

    root.innerHTML = `
      <div class="eyebrow">Финал</div>
      <h1 class="pixel-title" style="text-align:center; font-size:clamp(20px,6vw,32px);">CONGRATULATIONS</h1>
      ${winners.length ? `<div class="script-sub" style="display:block; text-align:center; margin:6px 0 4px; font-size:clamp(20px,5vw,28px);">${winners.map(w=>w.name).join(' & ')}</div>` : ''}
      <div class="winners-row">
        ${winners.map(w=>avatarHTML(w.name, 84, 'winner-avatar-big')).join('')}
      </div>
      <div class="quiz-card">
        ${ranked.map((r,i)=>`
          <div class="board-row ${i===0 && r.score>0 ? 'first':''}">
            <span class="board-name">${avatarHTML(r.name,22)} ${i+1}. ${r.name}</span>
            <span class="board-score">${r.score}</span>
          </div>
        `).join('') || '<p class="muted">Пока никто не набрал очков.</p>'}
        ${!isPlayerView ? `<div class="btn-row"><button class="btn btn-ghost" id="resetBtnEnd">Начать новую игру</button></div>` : ''}
      </div>
    `;
    if(!isPlayerView){
      const el = document.getElementById('resetBtnEnd');
      if(el) el.onclick = async ()=>{ await setState({phase:'lobby', qIndex:0}); await setPlayers({}); };
    }
  }

  renderRoleSelect();
})();
</script>

</body>
</html>
